# Generated by QA Studio (qa-studio:ci). Delete this line to keep your own edits:
# QA Studio then leaves the file alone on the next generate.
# Pipeline > Edit > Variables: add APP_BASE_URL / APP_LOGIN_URL, and APP_USER / APP_PASS /
# OTP_SECRET / QA_AI_API_KEY (and cloud grid keys) as secret variables.
# Visual checks: CI runs on Linux, so download qa-visual-baselines from the first run and
# commit its files to visual-baselines/ - later runs compare against them.
trigger:
  - main
  - master
pr:
  - main
  - master
pool:
  vmImage: ubuntu-latest
variables:
  CI: 'true'
  HEADLESS: 'true'
  PROGRESS: 'off'
  OPEN_REPORT: 'false'
  BROWSER: 'chrome'
  GRID: 'local'
jobs:
  - job: ui_tests
    displayName: UI tests
    timeoutInMinutes: 90
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: '22.x'
      - script: npm install
        displayName: Install packages
      - script: npx playwright install --with-deps chromium
        displayName: Install browsers
      - script: |
          for v in APP_USER APP_PASS OTP_SECRET QA_AI_API_KEY SMTP_PASS BROWSERSTACK_USERNAME BROWSERSTACK_ACCESS_KEY SAUCE_USERNAME SAUCE_ACCESS_KEY LT_USERNAME LT_ACCESS_KEY APP_BASE_URL APP_LOGIN_URL; do case "${!v}" in '$('*) unset "$v";; esac; done
          npm test
        displayName: Run the tests
        env:
          APP_USER: $(APP_USER)
          APP_PASS: $(APP_PASS)
          OTP_SECRET: $(OTP_SECRET)
          QA_AI_API_KEY: $(QA_AI_API_KEY)
          SMTP_PASS: $(SMTP_PASS)
          BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
          BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
          SAUCE_USERNAME: $(SAUCE_USERNAME)
          SAUCE_ACCESS_KEY: $(SAUCE_ACCESS_KEY)
          LT_USERNAME: $(LT_USERNAME)
          LT_ACCESS_KEY: $(LT_ACCESS_KEY)
          APP_BASE_URL: $(APP_BASE_URL)
          APP_LOGIN_URL: $(APP_LOGIN_URL)
      - task: PublishPipelineArtifact@1
        condition: always()
        continueOnError: true
        inputs:
          targetPath: playwright-report
          artifact: qa-playwright-report
      - task: PublishPipelineArtifact@1
        condition: always()
        continueOnError: true
        inputs:
          targetPath: test-results
          artifact: qa-test-results
      - task: PublishPipelineArtifact@1
        displayName: Keep the visual baselines
        condition: always()
        continueOnError: true
        inputs:
          targetPath: visual-baselines
          artifact: qa-visual-baselines

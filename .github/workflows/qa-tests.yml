# Generated by QA Studio (qa-studio:ci). Delete this line to keep your own edits:
# QA Studio then leaves the file alone on the next generate.
# Settings > Secrets and variables > Actions: add APP_BASE_URL / APP_LOGIN_URL (and GRID) as
# variables, APP_USER / APP_PASS / OTP_SECRET / QA_AI_API_KEY (and cloud grid keys) as secrets.
# Visual checks: CI runs on Linux, so download qa-visual-baselines from the first run and
# commit its files to visual-baselines/ - later runs compare against them.
name: QA tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      HEADLESS: "true"
      PROGRESS: "off"
      OPEN_REPORT: "false"
      BROWSER: "chrome"
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      APP_LOGIN_URL: ${{ vars.APP_LOGIN_URL }}
      GRID: ${{ vars.GRID || 'local' }}
      APP_USER: ${{ secrets.APP_USER }}
      APP_PASS: ${{ secrets.APP_PASS }}
      OTP_SECRET: ${{ secrets.OTP_SECRET }}
      QA_AI_API_KEY: ${{ secrets.QA_AI_API_KEY }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install packages
        run: npm install
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: Run the tests
        run: npm test
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qa-test-reports
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
      - name: Keep the visual baselines (download once and commit visual-baselines/)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qa-visual-baselines
          if-no-files-found: ignore
          path: visual-baselines/
